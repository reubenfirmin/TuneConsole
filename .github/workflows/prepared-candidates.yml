name: Final release candidates
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      revision:
        required: true
        type: string
jobs:
  wheel:
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
      UV_HTTP_TIMEOUT: '30'
      UV_HTTP_RETRIES: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare locked wheel dependencies
        timeout-minutes: 5
        run: python3 packaging/ci_stage.py --timeout 120 --attempts 2 wheel-dependencies -- uv sync --locked --only-group build --no-install-project
      - name: Build final-version wheel
        timeout-minutes: 2
        run: uv build --wheel --no-build-isolation --python .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-timings-${{ github.run_attempt }}
          path: ci-stage-timings.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          retention-days: 30
          path: dist/*.whl
          if-no-files-found: error
  containers:
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ inputs.version }}
      stage: true
      revision: ${{ inputs.revision }}
  macos:
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      revision: ${{ inputs.revision }}
  flatpak:
    needs: wheel
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      wheel-artifact: release-wheel
      release-candidate: true
      revision: ${{ inputs.revision }}
  provenance:
    needs: [wheel, containers, macos, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate
      - name: Install repository assembly tools
        timeout-minutes: 3
        run: |
          sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
          sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 install -y flatpak ostree
      - name: Assemble the final signed repository
        timeout-minutes: 2
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          printf '%s' "$FLATPAK_GPG_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          ostree --repo=candidate/flatpak-repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            mkdir -p "candidate/$arch"
            tar -xf "candidate/flatpak-repo-$arch.tar" -C "candidate/$arch"
            ostree --repo=candidate/flatpak-repo pull-local "candidate/$arch/repo"
          done
          # One signed summary contains both architectures' AppStream refs.
          flatpak build-update-repo candidate/flatpak-repo --no-summary-index --gpg-sign="$fpr"
          cp packaging/flatpak/tuneconsole.flatpakrepo candidate/flatpak-repo/
          tar -cf candidate/flatpak-repository.tar -C candidate flatpak-repo
      - name: Record final-version payload hashes and release commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python3 packaging/candidate_provenance.py create candidate "$RELEASE_TAG" --revision "$RELEASE_REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          overwrite: true
          retention-days: 30
          path: candidate/release-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-repository
          overwrite: true
          retention-days: 30
          path: candidate/flatpak-repository.tar
          if-no-files-found: error
