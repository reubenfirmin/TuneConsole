name: Final release candidates
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      revision:
        required: true
        type: string
      source-run:
        default: ''
        type: string
    secrets:
      FLATPAK_GPG_KEY:
        required: true
      SPARKLE_PRIVATE_ED_KEY:
        required: true
jobs:
  wheel:
    if: inputs.source-run == ''
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
      UV_HTTP_TIMEOUT: '30'
      UV_HTTP_RETRIES: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare locked wheel dependencies
        timeout-minutes: 5
        run: python3 packaging/ci_stage.py --timeout 120 --attempts 2 wheel-dependencies -- uv sync --locked --only-group build --no-install-project
      - name: Build final-version wheel
        timeout-minutes: 2
        run: uv build --wheel --no-build-isolation --python .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-timings-${{ github.run_attempt }}
          path: ci-stage-timings.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          overwrite: true
          retention-days: 30
          path: dist/*.whl
          if-no-files-found: error
  containers:
    if: inputs.source-run == ''
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ inputs.version }}
      stage: true
      revision: ${{ inputs.revision }}
  macos:
    if: inputs.source-run == ''
    uses: ./.github/workflows/macos.yml
    secrets:
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
    with:
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      revision: ${{ inputs.revision }}
  flatpak:
    needs: wheel
    uses: ./.github/workflows/flatpak.yml
    secrets:
      FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
    with:
      version: ${{ inputs.version }}
      wheel-artifact: release-wheel
      release-candidate: true
      revision: ${{ inputs.revision }}
  provenance:
    needs: [wheel, containers, macos, flatpak]
    if: >-
      !cancelled() && (inputs.source-run != '' ||
      (needs.wheel.result == 'success' && needs.containers.result == 'success' &&
      needs.macos.result == 'success' && needs.flatpak.result == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-run != '' && github.workflow_sha || inputs.revision }}
          fetch-depth: ${{ inputs.source-run != '' && '0' || '1' }}
      - name: Select the original platform artifacts
        if: inputs.source-run != ''
        id: retained
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.source-run }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python3 packaging/release_candidates.py "$SOURCE_RUN" "$RELEASE_TAG" "$RELEASE_REVISION" --recover
      - uses: actions/download-artifact@v4
        if: inputs.source-run != ''
        with:
          artifact-ids: ${{ steps.retained.outputs.artifact_ids }}
          run-id: ${{ inputs.source-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: candidate
      - uses: actions/download-artifact@v4
        if: inputs.source-run == ''
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate
      - uses: docker/setup-buildx-action@v3
        if: inputs.source-run != ''
      - uses: docker/login-action@v3
        if: inputs.source-run != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and recover retained container receipts
        if: inputs.source-run != ''
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
        run: |
          for arch in amd64 arm64; do
            receipt="candidate/container-$arch.json"
            python3 packaging/container/receipt.py "${IMAGE,,}" "$arch" "$VERSION" "$RELEASE_REVISION" "$receipt" --repair "$receipt"
          done
      - name: Install repository assembly tools
        timeout-minutes: 5
        run: |
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2)
          packages=(flatpak ostree)
          python3 packaging/ci_stage.py --timeout 70 --attempts 2 flatpak-apt-indexes -- \
            sudo timeout --verbose --kill-after=5s 60s apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          python3 packaging/ci_stage.py --timeout 70 --attempts 2 flatpak-apt-download -- \
            sudo timeout --verbose --kill-after=5s 60s apt-get "${apt_options[@]}" \
              install --yes --download-only --no-install-recommends "${packages[@]}"
          sudo apt-get install --yes --no-download --no-install-recommends "${packages[@]}"
      - name: Assemble the final signed repository
        timeout-minutes: 2
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          printf '%s' "$FLATPAK_GPG_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          ostree --repo=candidate/flatpak-repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            mkdir -p "candidate/$arch"
            tar -xf "candidate/flatpak-repo-$arch.tar" -C "candidate/$arch"
            ostree --repo=candidate/flatpak-repo pull-local "candidate/$arch/repo"
          done
          # One signed summary contains both architectures' AppStream refs.
          flatpak build-update-repo candidate/flatpak-repo --no-summary-index --gpg-sign="$fpr"
          git show "$RELEASE_REVISION:packaging/flatpak/tuneconsole.flatpakrepo" > candidate/flatpak-repo/tuneconsole.flatpakrepo
          tar -cf candidate/flatpak-repository.tar -C candidate flatpak-repo
      - name: Record final-version payload hashes and release commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
          ORIGINAL_RUN: ${{ inputs.source-run }}
        run: |
          tree=$(git rev-parse "$RELEASE_REVISION^{tree}")
          python3 packaging/candidate_provenance.py create candidate "$RELEASE_TAG" --revision "$RELEASE_REVISION" --tree "$tree" --original-run "$ORIGINAL_RUN"
      - uses: actions/upload-artifact@v4
        if: inputs.source-run != ''
        with:
          name: release-recovered-platforms
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: |
            candidate/*.flatpak
            candidate/*.dmg
            candidate/appcast-*.xml
            candidate/yt_playlist-*.whl
            candidate/container-*.json
            candidate/flatpak-repo-*.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          overwrite: true
          retention-days: 30
          path: candidate/release-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-repository
          overwrite: true
          retention-days: 30
          path: candidate/flatpak-repository.tar
          if-no-files-found: error
