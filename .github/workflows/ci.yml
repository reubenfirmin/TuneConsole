# Tests run only on PRs. Releases build and publish independently.
#
# Each suite uses four isolated runners, with serial pytest inside each runner.
name: PR checks

on:
  pull_request:

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      timing_run: ${{ steps.plan.outputs.timing_run }}
      timing_artifact: ${{ steps.plan.outputs.timing_artifact }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/ci_plan.py
  unit:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    name: unit (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      UV_PYTHON: '3.12'  # Exercise the minimum supported application runtime.
      SHARD_TOTAL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: uv sync --locked --group build
      - name: Verify packaged resolutions
        if: matrix.shard == 1
        run: uv run --frozen --group build python packaging/generate_deps.py --check
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.timing_artifact != ''
        with:
          artifact-ids: ${{ needs.plan.outputs.timing_artifact }}
          run-id: ${{ needs.plan.outputs.timing_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: shard-baseline
          merge-multiple: true
      - name: Run the unit / route suite
        env:
          SHARD_BASELINE: ${{ needs.plan.outputs.timing_artifact != '' && 'shard-baseline' || '.github/test-durations.json' }}
        run: uv run pytest --ci-suite=unit --ci-shard=${{ matrix.shard }}/$SHARD_TOTAL --ci-shard-report=evidence/shard.json --ci-duration-baseline="$SHARD_BASELINE" --junitxml=evidence/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 30

  browser:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      # Match the locked Playwright version; browsers and OS dependencies are preinstalled.
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble
      options: --init --ipc=host
    permissions:
      contents: read
      actions: read
    name: browser (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.timing_artifact != ''
        with:
          artifact-ids: ${{ needs.plan.outputs.timing_artifact }}
          run-id: ${{ needs.plan.outputs.timing_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: shard-baseline
          merge-multiple: true
      - name: Run the live-browser suite
        env:
          SHARD_BASELINE: ${{ needs.plan.outputs.timing_artifact != '' && 'shard-baseline' || '.github/test-durations.json' }}
        run: uv run pytest -m browser --ci-suite=browser --ci-shard=${{ matrix.shard }}/$SHARD_TOTAL --ci-shard-report=evidence/shard.json --ci-duration-baseline="$SHARD_BASELINE" --junitxml=evidence/junit.xml --tracing=retain-on-failure --output=evidence/browser-traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 30

  coverage:
    if: always() && github.event_name == 'pull_request' && needs.plan.result == 'success'
    needs: [plan, unit, browser]
    runs-on: ubuntu-latest
    env:
      SHARD_TOTAL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-shard-*-${{ github.run_attempt }}'
          path: evidence
      - name: Prove exact case coverage and retain measured file durations
        run: |
          uv run python ci_test_shards.py evidence unit --total="$SHARD_TOTAL"
          uv run python ci_test_shards.py evidence browser --total="$SHARD_TOTAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-test-timings-${{ github.run_attempt }}
          path: evidence/*-timings.json
          if-no-files-found: ignore
          retention-days: 30

  checks:
    if: always()
    needs: [plan, unit, browser, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every source test job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(results[name]['result'] == 'success' for name in ('plan', 'unit', 'browser', 'coverage')), results
          PY
  metrics:
    # Measure the completed stable gate as well as queues, setup and coverage.
    if: always() && github.event_name == 'pull_request' && needs.plan.result == 'success'
    needs: [plan, coverage, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      SHARD_TOTAL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.coverage.result == 'success'
        with:
          name: source-test-timings-${{ github.run_attempt }}
          path: evidence
      - name: Record queue, setup and total test runner time
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/ci_test_metrics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-test-run-metrics-${{ github.run_attempt }}
          path: ci-test-metrics.json
          if-no-files-found: ignore
          retention-days: 30

  containers:
    needs: checks
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/container.yml
    with:
      version: '0.0.0.dev0'

  publisher-contract:
    needs: checks
    # Only same-repository PRs receive the token needed for the isolated rehearsal.
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REHEARSAL_TAG: publisher-contract-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Exercise authenticated draft and resumed asset lifecycle
        run: python3 packaging/rehearse_publisher.py "$REHEARSAL_TAG"
      - name: Exercise authenticated GHCR blob upload lifecycle
        run: python3 packaging/release_services.py registry
      - name: Clean up isolated draft even after failure
        if: always()
        run: python3 packaging/rehearse_publisher.py "$REHEARSAL_TAG" --cleanup-only

  macos:
    needs: checks
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/macos.yml
    with:
      version: '0.0.0.dev0'
      tag: ''

  wheel:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0.dev0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --only-group build --no-install-project
      - run: uv build --wheel --no-build-isolation --python .venv/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: ci-wheel
          path: dist/*.whl
          if-no-files-found: error

  flatpak:
    needs: [checks, wheel]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/flatpak.yml
    with:
      version: '0.0.0.dev0'
      wheel-artifact: ci-wheel
