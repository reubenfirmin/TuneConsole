name: macOS candidate
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version || '0.0.0.dev0' }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: packaging/macos/.sparkle/distribution.tar.xz
          key: sparkle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/macos/build.sh') }}
      - name: Prepare locked dependencies within their own budget
        timeout-minutes: 9
        run: python3 packaging/ci_stage.py --timeout 240 --attempts 2 macos-dependencies -- packaging/macos/build.sh --prepare-only
      - name: Build locked app and DMG
        timeout-minutes: 6
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          packaging/macos/build.sh --build-only
      - name: Smoke-test frozen app and DMG
        timeout-minutes: 2
        run: packaging/macos/smoke.sh
      - name: Stage architecture-specific downloads
        run: |
          cp packaging/macos/dist/TuneConsole-*.dmg "TuneConsole-macos-${{ matrix.arch }}.dmg"
          if [[ '${{ matrix.arch }}' == arm64 ]]; then cp TuneConsole-macos-arm64.dmg TuneConsole-macos.dmg; fi
      - name: Sign and verify the immutable update feed
        if: inputs.tag != ''
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY"
          mkdir -p packaging/macos/dist/update-feed
          cp "TuneConsole-macos-${{ matrix.arch }}.dmg" packaging/macos/dist/update-feed/
          printf '%s\n' "$SPARKLE_PRIVATE_ED_KEY" | packaging/macos/.sparkle/bin/generate_appcast \
            --ed-key-file - --maximum-versions 1 --maximum-deltas 0 \
            --download-url-prefix "https://github.com/reubenfirmin/TuneConsole/releases/download/$RELEASE_TAG/" \
            --link https://tuneconsole.com -o "appcast-macos-${{ matrix.arch }}.xml" packaging/macos/dist/update-feed
          signature=$(python3 packaging/macos/verify_appcast.py "appcast-macos-${{ matrix.arch }}.xml" \
            "TuneConsole-macos-${{ matrix.arch }}.dmg" "$RELEASE_TAG" '${{ matrix.arch }}')
          printf '%s\n' "$SPARKLE_PRIVATE_ED_KEY" | packaging/macos/.sparkle/bin/sign_update \
            --ed-key-file - --verify "TuneConsole-macos-${{ matrix.arch }}.dmg" "$signature"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-timings-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ci-stage-timings.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          retention-days: 30
          if-no-files-found: error
          path: |
            TuneConsole-macos*.dmg
            appcast-macos-*.xml
