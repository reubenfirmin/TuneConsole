name: Container image
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      stage:
        default: false
        type: boolean
      revision:
        default: ''
        type: string
# Permissions come from the caller. Only production candidate jobs can push to GHCR.
concurrency:
  group: containers-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version || '0.0.0.dev0' }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: docker/setup-buildx-action@v3
        timeout-minutes: 2
      - uses: docker/build-push-action@v6
        timeout-minutes: 8
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: tuneconsole:candidate
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ inputs.revision || github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Test the exact image that will be staged
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: python3 packaging/container/smoke.py --engine docker --image tuneconsole:candidate --version "$VERSION"
      - uses: docker/login-action@v3
        if: inputs.stage
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the candidate digest without rebuilding
        if: inputs.stage
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          image="${IMAGE,,}"
          tag="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag tuneconsole:candidate "$image:$tag"
          docker push "$image:$tag"
          python3 packaging/container/receipt.py "$image" "$ARCH" "$VERSION" "$REVISION" "container-$ARCH.json" --tag "$tag"
      - uses: actions/upload-artifact@v4
        if: inputs.stage
        with:
          name: release-container-${{ matrix.arch }}
          overwrite: true
          retention-days: 30
          path: container-${{ matrix.arch }}.json
          if-no-files-found: error
