name: Release coordinator
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      source_run:
        description: Original tag build run with complete, unexpired candidate artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      version: ${{ steps.policy.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: revision
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - id: policy
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 packaging/release_policy.py "$RELEASE_TAG"
  checks:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
    steps:
      - name: Require completed CI for the exact tagged revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
        run: |
          # PR checks validate a synthetic merge commit. Only a main push or explicit
          # manual check of this exact revision can admit release builds.
          run_ids=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_REVISION" -f status=success | \
            jq --raw-output --arg revision "$RELEASE_REVISION" '.workflow_runs[] | select(.head_sha == $revision and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")) | .id')
          if [ -z "$run_ids" ]; then
            echo "::error::Run Tests successfully for $RELEASE_REVISION before retrying this release."
            exit 1
          fi
          printf 'Verified CI run(s): %s\n' "$run_ids"
  preflight:
    needs: [version, checks, candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      REHEARSAL_TAG: publisher-contract-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check publisher services before expensive platform work
        env:
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 packaging/release_services.py preflight "$RELEASE_TAG" --revision "$RELEASE_REVISION" --rehearsal-tag "$REHEARSAL_TAG"
      - name: Clean up isolated draft even after failure
        if: always()
        run: python3 packaging/rehearse_publisher.py "$REHEARSAL_TAG" --cleanup-only
  candidates:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_ids: ${{ steps.inspect.outputs.artifact_ids }}
      source_run: ${{ steps.inspect.outputs.source_run }}
      ci_completed_at: ${{ steps.inspect.outputs.ci_completed_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - id: inspect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run || 'auto' }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 packaging/release_candidates.py "$SOURCE_RUN" "$RELEASE_TAG" "$RELEASE_REVISION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-status-${{ github.run_attempt }}
          path: candidate-status.json
          if-no-files-found: ignore
  promote:
    needs: [version, checks, preflight, candidates]
    if: >-
      always() && needs.version.result == 'success' && needs.checks.result == 'success' &&
      needs.preflight.result == 'success' && needs.candidates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All tags share this owner. Do not cancel a promotion already changing channels.
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidates.outputs.artifact_ids }}
          run-id: ${{ needs.candidates.outputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: candidate
      - name: Verify immutable payload handoff before any channel changes
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
          SOURCE_RUN: ${{ needs.candidates.outputs.source_run }}
        run: |
          if [ -f candidate/release-provenance.json ]; then
            python3 packaging/candidate_provenance.py verify candidate "$RELEASE_TAG" --revision "$RELEASE_REVISION" --source-run "$SOURCE_RUN"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install publication tools within a separate setup budget
        timeout-minutes: 3
        run: |
          sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
          sudo timeout 120 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 install -y flatpak ostree
      - name: Restore the exact signed repository from CI
        timeout-minutes: 2
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          if [ -f candidate/flatpak-repository.tar ]; then
            tar -xf candidate/flatpak-repository.tar -C candidate
            exit 0
          fi
          # Transitional support for retained candidates from the original tag
          # build workflow. New CI candidates always contain the signed archive.
          printf '%s' "$FLATPAK_GPG_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          ostree --repo=candidate/flatpak-repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            mkdir -p "candidate/$arch"
            tar -xf "candidate/flatpak-repo-$arch.tar" -C "candidate/$arch"
            ostree --repo=candidate/flatpak-repo pull-local "candidate/$arch/repo"
          done
          flatpak build-update-repo candidate/flatpak-repo --no-summary-index --gpg-sign="$fpr"
          cp packaging/flatpak/tuneconsole.flatpakrepo candidate/flatpak-repo/
      - name: Validate all assets and promote with rollback and version ordering
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 packaging/promote_release.py candidate "$RELEASE_TAG" --budget-seconds 180
      - name: Verify anonymous downloads and signed public update channels
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 packaging/release_services.py public "$RELEASE_TAG"
      - name: Preserve channel recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/channel-recovery.json
            candidate/release-manifest.json
          if-no-files-found: ignore
          retention-days: 90
  summary:
    needs: [version, checks, preflight, candidates, promote]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*timings*'
          path: evidence/timings
          run-id: ${{ needs.candidates.outputs.source_run || inputs.source_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: candidate-status-${{ github.run_attempt }}
          path: evidence/candidates
          merge-multiple: true
      - name: Record completed work and recovery action
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.version.outputs.tag || inputs.tag || github.ref_name }}
          SOURCE_RUN: ${{ needs.candidates.outputs.source_run || inputs.source_run || github.run_id }}
        run: python3 packaging/release_summary.py
      - name: Measure green CI through verified publication
        if: needs.candidates.outputs.ci_completed_at != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/release_timing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ github.run_attempt }}
          path: |
            release-status.md
            release-timing.json
