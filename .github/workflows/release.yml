name: Release coordinator
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      source_run:
        description: Optional run ID to reuse an exact prepared candidate
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  version:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      version: ${{ steps.policy.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - id: revision
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - id: policy
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 packaging/release_policy.py "$RELEASE_TAG"
  preflight:
    needs: [version, candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the publication services
        env:
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 packaging/release_services.py preflight "$RELEASE_TAG" --revision "$RELEASE_REVISION"
  candidates:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_ids: ${{ steps.inspect.outputs.artifact_ids }}
      source_run: ${{ steps.inspect.outputs.source_run }}
      build_revision: ${{ steps.inspect.outputs.build_revision }}
      build_tree: ${{ steps.inspect.outputs.build_tree }}
      status_artifact: ${{ steps.evidence.outputs.artifact-id }}
      release_started_at: ${{ steps.inspect.outputs.release_started_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - id: inspect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 packaging/release_candidates.py "$SOURCE_RUN" "$RELEASE_TAG" "$RELEASE_REVISION"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: candidate-status-${{ github.run_attempt }}
          path: candidate-status.json
          if-no-files-found: ignore
  promote:
    needs: [version, preflight, candidates]
    if: >-
      always() && needs.version.result == 'success' &&
      needs.preflight.result == 'success' && needs.candidates.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # All tags share this owner. Do not cancel a promotion already changing channels.
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidates.outputs.artifact_ids }}
          run-id: ${{ needs.candidates.outputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: candidate
      - name: Verify immutable payload handoff before any channel changes
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          BUILD_REVISION: ${{ needs.candidates.outputs.build_revision }}
          BUILD_TREE: ${{ needs.candidates.outputs.build_tree }}
          SOURCE_RUN: ${{ needs.candidates.outputs.source_run }}
        run: python3 packaging/candidate_provenance.py verify candidate "$RELEASE_TAG" --revision "$BUILD_REVISION" --tree "$BUILD_TREE" --source-run "$SOURCE_RUN"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install publication tools within a separate setup budget
        timeout-minutes: 5
        run: |
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2)
          packages=(flatpak ostree)
          python3 packaging/ci_stage.py --timeout 70 --attempts 2 flatpak-apt-indexes -- \
            sudo timeout --verbose --kill-after=5s 60s apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          python3 packaging/ci_stage.py --timeout 70 --attempts 2 flatpak-apt-download -- \
            sudo timeout --verbose --kill-after=5s 60s apt-get "${apt_options[@]}" \
              install --yes --download-only --no-install-recommends "${packages[@]}"
          sudo apt-get install --yes --no-download --no-install-recommends "${packages[@]}"
      - name: Restore the signed repository from the release build
        timeout-minutes: 2
        run: tar -xf candidate/flatpak-repository.tar -C candidate
      - name: Validate all assets and promote with rollback and version ordering
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 packaging/promote_release.py candidate "$RELEASE_TAG" --budget-seconds 180
      - name: Verify anonymous downloads and signed public update channels
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 packaging/release_services.py public "$RELEASE_TAG"
      - name: Preserve channel recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/channel-recovery.json
            candidate/release-manifest.json
          if-no-files-found: ignore
          retention-days: 90
  summary:
    needs: [version, preflight, candidates, promote]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*timings*'
          path: evidence/timings
          run-id: ${{ needs.candidates.outputs.source_run || inputs.source_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: needs.candidates.outputs.status_artifact != ''
        with:
          artifact-ids: ${{ needs.candidates.outputs.status_artifact }}
          path: evidence/candidates
          merge-multiple: true
      - name: Record completed work and recovery action
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.version.outputs.tag || inputs.tag || github.ref_name }}
          SOURCE_RUN: ${{ needs.candidates.outputs.source_run || inputs.source_run }}
        run: python3 packaging/release_summary.py
      - name: Measure verified publication
        if: needs.candidates.outputs.release_started_at != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/release_timing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-status-${{ github.run_attempt }}
          path: |
            release-status.md
            release-timing.json
