name: Release coordinator
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Existing release tag to finish publishing
        required: true
        type: string
      candidate_run_id:
        description: Release run with all candidate builds completed successfully
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: policy
        env:
          RELEASE_TAG: ${{ inputs.candidate_tag || github.ref_name }}
        run: python3 packaging/release_policy.py "$RELEASE_TAG"
      - name: Verify the original candidate builds before resuming publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_sha=$(git rev-parse "$CANDIDATE_TAG^{commit}")
          python3 packaging/release_candidate.py "$CANDIDATE_RUN_ID" "$CANDIDATE_TAG" "$candidate_sha"
  # Unit and browser suites run in CI before the release is tagged.
  containers:
    if: github.event_name != 'workflow_dispatch'
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ needs.version.outputs.version }}
  macos:
    if: github.event_name != 'workflow_dispatch'
    needs: version
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ github.ref_name }}
  wheel:
    if: github.event_name != 'workflow_dispatch'
    needs: version
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --only-group build --no-install-project
      - run: uv build --wheel --no-build-isolation --python .venv/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error
  flatpak:
    if: github.event_name != 'workflow_dispatch'
    needs: [version, wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: release-wheel, path: dist}
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build signed candidate and check packaged startup and bridge
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        working-directory: packaging/flatpak
        run: |
          printf '%s' "$FLATPAK_GPG_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo --gpg-sign="$fpr" --force-clean build-dir com.tuneconsole.TuneConsole.yaml
          flatpak build-update-repo repo --gpg-sign="$fpr"
          gpg --batch --export "$fpr" > repo-key.gpg
          python3 bundle.py repo "TuneConsole-$ARCH.flatpak" repo-key.gpg
          flatpak install --user --noninteractive "TuneConsole-$ARCH.flatpak"
          python3 smoke.py "$VERSION"
          tar -cf "flatpak-repo-$ARCH.tar" repo
          if [[ "$ARCH" == x86_64 ]]; then cp "TuneConsole-$ARCH.flatpak" TuneConsole.flatpak; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            packaging/flatpak/TuneConsole*.flatpak
            packaging/flatpak/flatpak-repo-*.tar
  promote:
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
          (github.event_name == 'workflow_dispatch' ||
           (needs.wheel.result == 'success' && needs.flatpak.result == 'success' &&
            needs.macos.result == 'success' && needs.containers.result == 'success')) }}
    needs: [version, wheel, flatpak, macos, containers]
    runs-on: ubuntu-latest
    # All tags share this owner. Do not cancel a promotion already changing channels.
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the exact signed repositories from both architectures
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          printf '%s' "$FLATPAK_GPG_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          ostree --repo=candidate/flatpak-repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            mkdir -p "candidate/$arch"
            tar -xf "candidate/flatpak-repo-$arch.tar" -C "candidate/$arch"
            ostree --repo=candidate/flatpak-repo pull-local "candidate/$arch/repo"
          done
          flatpak build-update-repo candidate/flatpak-repo --gpg-sign="$fpr"
          cp packaging/flatpak/tuneconsole.flatpakrepo candidate/flatpak-repo/
      - name: Validate all assets and promote with rollback and version ordering
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ inputs.candidate_tag || github.ref_name }}
        run: python3 packaging/promote_release.py candidate "$RELEASE_TAG"
