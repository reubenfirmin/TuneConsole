<!doctype html>
<html lang="en" class="gen-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiring up your playlist…</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/tokens.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/components.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/clusters.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/generating.css?v={{ asset_v }}">
  <script src="/static/theme.js?v={{ asset_v }}"></script>
  <script src="/static/generating.js?v={{ asset_v }}"></script>
</head>
<body>
  <div class="gen-stage" role="status" aria-live="polite" aria-label="Preparing playlist">
    {% with loader_status='Wiring up your playlist', loader_detail='Keep this tab open. Your playlist opens here when it is ready.' %}
    {% include "_partials/launch_loader.html" %}
    {% endwith %}
    <span class="gen-brand brand" aria-label="TuneConsole">
      <img class="brand-mark" src="/static/favicon.svg?v={{ asset_v }}" width="28" height="28" alt="">
      <span class="brand-name" aria-hidden="true">tuneconsole</span>
    </span>
  </div>
  <script>
  (() => {
    let thumbs = [];
    try { thumbs = JSON.parse(localStorage.getItem('tc_gen_thumbs') || '[]'); } catch (_) {}
    const loader = createLaunchLoader(document.querySelector('.gen-loader'), {
      thumbs: Array.isArray(thumbs) ? thumbs : [],
      statuses: ['Wiring up your playlist', 'Building on YouTube Music'],
      detail: 'Keep this tab open. Your playlist opens here when it is ready.'
    });
    const destroy = () => {
      loader.destroy();
      window.removeEventListener('pagehide', destroy);
      window.removeEventListener('app-page-leaving', destroy);
    };
    window.addEventListener('pagehide', destroy);
    window.addEventListener('app-page-leaving', destroy);
  })();
  </script>
</body>
</html>
