{# Global playback instrument. playerStatus polls on non-Home pages; on Home it consumes the existing
   homeStatus bridge-status event so the page still has exactly one /bridge/status poller. #}
<section class="home-status card card--status is-live global-now-playing" x-data="playerStatus()"
         x-init="init(); $nextTick(() => mountNowPlayingDock())"
         @bridge-status.window="apply($event.detail)"
         x-show="connected && nowPlaying && (nowPlaying.title || nowPlaying.artist)" x-cloak>
  <div class="hs-main">
    <span class="hs-dot" aria-hidden="true"></span>
    <template x-if="nowPlaying && (nowPlaying.title || nowPlaying.artist)">
      <div class="hs-now" :class="{ paused: nowPlaying.paused }">
        <img class="hs-art" x-show="nowPlaying.thumbnail" :src="nowPlaying.thumbnail" alt=""
             referrerpolicy="no-referrer">
        <span class="hs-eq" x-show="!nowPlaying.paused" x-cloak aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="hs-now-text">
          <span class="hs-now-title" x-text="nowPlaying.title || ''"></span>
          <span class="hs-now-artist" x-show="nowPlaying.artist" x-text="nowPlaying.artist || ''"></span>
        </span>
        <span class="hs-rate-group">
          <button type="button" class="hs-rate hs-playpause" @click="toggle()"
                  :title="nowPlaying.paused ? 'Play' : 'Pause'"
                  :aria-label="nowPlaying.paused ? 'Play' : 'Pause'">
            <span x-show="!nowPlaying.paused" x-cloak>&#10074;&#10074;</span>
            <span x-show="nowPlaying.paused" x-cloak>&#9654;</span>
          </button>
          <button type="button" class="hs-rate hs-heart" :class="{ on: nowPlaying.likeStatus === 'LIKE' }"
                  @click="rate('like')" title="Like" aria-label="Like">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </button>
          <button type="button" class="hs-rate hs-skull" :class="{ on: nowPlaying.likeStatus === 'DISLIKE' }"
                  @click="rate('dislike')" title="Dislike" aria-label="Dislike">
            <svg viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C7.58 2 4 5.58 4 10c0 2.4 1.06 4.55 2.73 6.02.17.15.27.36.27.59V19c0 .55.45 1 1 1h.5v.5a1 1 0 1 0 2 0V20h1v.5a1 1 0 1 0 2 0V20h.5c.55 0 1-.45 1-1v-2.39c0-.23.1-.44.27-.59A7.99 7.99 0 0 0 20 10c0-4.42-3.58-8-8-8ZM9 8.5A1.5 1.5 0 1 0 9 11.5 1.5 1.5 0 0 0 9 8.5Zm6 0A1.5 1.5 0 1 0 15 11.5 1.5 1.5 0 0 0 15 8.5Z"/></svg>
          </button>
        </span>
        <div id="radio-steer-slot"></div>
      </div>
    </template>
  </div>
</section>
