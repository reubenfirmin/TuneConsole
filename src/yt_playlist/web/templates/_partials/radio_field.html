{# Keep one continuous field outside main's transformed page layout. #}
<template x-teleport="body">
  <svg class="radio-space-field" x-show="visible" x-cloak aria-hidden="true">
    <defs>
      <pattern id="radio-stipple" width="12" height="12" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r=".65" fill="var(--dim)" opacity=".18"/>
      </pattern>
      <radialGradient id="radio-space-fade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
                      :gradient-transform.camel="'translate(' + fieldArea.cx + ' ' + fieldArea.cy + ') scale(' + fieldArea.rx + ' ' + fieldArea.ry + ')'">
        <stop stop-color="white"/>
        <stop offset=".45" stop-color="white"/>
        <stop offset=".6" stop-color="white" stop-opacity=".9"/>
        <stop offset=".75" stop-color="white" stop-opacity=".42"/>
        <stop offset=".9" stop-color="white" stop-opacity=".07"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <filter id="radio-space-feather" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".0025 .0035" numOctaves="2" seed="23" result="drift"/>
        <feDisplacementMap in="SourceGraphic" in2="drift" scale="140" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <mask id="radio-space-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
        {# Drift affects only the radial opacity mask, never the dot positions or page color. #}
        <g filter="url(#radio-space-feather)">
          <rect :x="fieldArea.cx - fieldArea.rx" :y="fieldArea.cy - fieldArea.ry"
                :width="fieldArea.rx * 2" :height="fieldArea.ry * 2" fill="url(#radio-space-fade)"/>
        </g>
        <circle :cx="fieldHub.x" :cy="fieldHub.y" :r="state.active && !launching ? fieldHub.r : 0" fill="black"/>
      </mask>
    </defs>
    <rect fill="url(#radio-stipple)" width="100%" height="100%" mask="url(#radio-space-clearance)"/>
  </svg>
</template>
