{# One landscape spans the history and junction; its contours also weave through the Y. #}
<div class="radio-history-art" aria-hidden="true">
  <svg class="radio-engraving" viewBox="0 0 1200 452" preserveAspectRatio="none"
       :view-box.camel="'0 0 ' + drawingSpace.width + ' ' + (drawingSpace.historyHeight + drawingSpace.gapHeight)">
    <defs>
      <linearGradient id="radio-ink-fade"><stop stop-color="var(--radio-queue-0)" stop-opacity=".6"/><stop offset=".55" stop-color="var(--radio-queue-2)" stop-opacity=".45"/><stop offset="1" stop-color="var(--radio-queue-1)" stop-opacity=".12"/></linearGradient>
      <clipPath id="radio-record-label"><circle cx="244" cy="171" r="57"/></clipPath>
      <clipPath id="radio-drawing-clearance"><path :d="drawingClearance" clip-rule="evenodd"/></clipPath>
    </defs>
    <g class="radio-wave-landscape" clip-path="url(#radio-drawing-clearance)">
      {% for i in range(14) %}
      <path id="radio-landscape-{{ i }}" :style="landscapeStyle({{ i }})"/>
      {% endfor %}
    </g>
    <g class="radio-record-echoes">
      {# SVG template elements lack HTMLTemplateElement.content, which Alpine's
         x-for needs. Reserve the bounded set of SVG uses on the server instead. #}
      {% for i in range(24) %}
      <use class="radio-record-echo" href="#radio-record-disc" x-show="recordEchoes.length > {{ i }}"
           :transform="recordEchoes[{{ i }}]?.transform || ''"
           :opacity=".7 / (recordEchoes[{{ i }}]?.depth || 1)"/>
      {% endfor %}
    </g>
    <g :transform="engravingTransform">
    <g class="radio-orbit-lines">
      <ellipse cx="244" cy="171" rx="203" ry="117" :transform="orbitTransform(0)"/>
      <ellipse cx="244" cy="171" rx="179" ry="139" :transform="orbitTransform(1)"/>
      <path d="M16 171H74m340 0h50M244 9v22m0 279v22"/>
      <circle cx="244" cy="171" r="145" stroke-dasharray="1 9"/>
    </g>
    <g class="radio-record" id="radio-record-disc">
      <circle class="radio-record-ground" cx="244" cy="171" r="119"/>
      {% for radius in [65, 70, 77, 81, 88, 94, 100, 107, 113, 119] %}
      <circle class="radio-record-groove" cx="244" cy="171" r="{{ radius }}"/>
      {% endfor %}
      <path class="radio-record-shine" d="M155 112a107 107 0 0 1 137-37m40 155a107 107 0 0 1-137 37"/>
      <image class="radio-record-cover" x="187" y="114" width="114" height="114"
             clip-path="url(#radio-record-label)" preserveAspectRatio="xMidYMid slice"
             :href="recordCover || null" x-show="recordCover && recordCoverFailed !== recordCover"
             @error="if ($el.getAttribute('href') === recordCover) recordCoverFailed = recordCover"/>
      <circle class="radio-record-rim" cx="244" cy="171" r="57"/>
      <circle class="radio-record-spindle" cx="244" cy="171" r="9"/>
      <circle class="radio-record-pin" cx="244" cy="171" r="2.5"/>
    </g>
    <g class="radio-dial-ticks">
      {% for i in range(46) %}<path d="M{{ 511 + i * 14 }} 35v{{ 11 if i % 5 == 0 else 4 }}"/>{% endfor %}
      <path d="M511 52h630"/>
    </g>
    </g>
  </svg>
</div>
