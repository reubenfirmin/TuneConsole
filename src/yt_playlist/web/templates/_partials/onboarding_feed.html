<div id="onboarding-feed" class="setup-home" x-data="onboardingArrival()">
  {% include "_partials/onboarding_arrival.html" %}
  <div class="setup-listening" x-show="connected" x-cloak>
    {% if onboard_library %}
    <div hx-get="/home/onboard/start" hx-trigger="load" hx-swap="outerHTML">
      <span class="sr-only">Finding something to listen to</span>
    </div>
    {% else %}
    <div hx-get="/home/onboard/radio" hx-trigger="load" hx-swap="outerHTML">
      <span class="sr-only">Finding something to listen to</span>
    </div>
    {% endif %}
  </div>
</div>
