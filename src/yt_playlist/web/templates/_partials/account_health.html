<template x-teleport="#account-health-slot">
<section class="account-health" aria-label="Account health">
  <div class="growth-health-name"><strong>Account health</strong><span x-text="growth.health.label"></span></div>
  <div class="growth-health-progress">
    <div><span>Catalog prepared</span> <strong x-text="growth.health.percent + '%'"></strong></div>
    <progress max="100" :value="growth.health.percent" aria-label="Catalog preparation"></progress>
    <span x-text="growth.health.processed.toLocaleString() + ' of ' + growth.health.total.toLocaleString() + ' songs'"></span>
  </div>
  <button type="button" class="btn-ghost growth-health-link" @click="go('unlocks')">View unlocks {% include '_partials/growth_star.html' %}</button>
</section>
</template>
<aside class="growth-unlock-notice" x-show="(notice || choiceInvite) && !choosing && !selectedNode" x-cloak aria-label="New listening options" aria-live="polite">
  <div class="growth-unlock-copy" x-show="notice">
    {% include '_partials/growth_star.html' %}
    <div><strong x-text="notice?.id === 'vibes' ? 'Set the mood in Mix tapes' : notice?.label"></strong>
      <span x-text="notice?.detail"></span></div>
    <button class="btn btn-primary" type="button" @click="openNode(notice.id)">See what’s new</button>
    <button class="btn-ghost" type="button" @click="markSeen(notice)">Mark as seen</button>
  </div>
  <div class="growth-home-invite" x-show="choiceInvite && !choosing">
    <div><strong>Choose what opens on Home</strong><span>Long play, Mix tapes and On air are now ready.</span></div>
    <button class="btn-ghost" type="button" @click="openChoice()">Choose my Home</button>
    <button class="btn-ghost" type="button" @click="decideLater()">Later</button>
  </div>
</aside>
<dialog class="growth-dialog growth-home-dialog" x-ref="homeDialog" aria-label="Choose what opens on Home"
        @close="choosing = false" @click="if ($event.target === $el) $el.close()">
  <button class="growth-dialog-close" type="button" @click="$refs.homeDialog.close()" aria-label="Close Home choice">×</button>
  {% include '_partials/growth_home_choice.html' %}
</dialog>
