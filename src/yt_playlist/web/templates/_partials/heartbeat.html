{% if exit_on_idle %}
<script>
  // Every app page, including standalone recaps, keeps the packaged server alive.
  (function () {
    function beat() { fetch('/heartbeat', { method: 'POST', keepalive: true }).catch(function () {}); }
    beat();
    setInterval(beat, 3000);
    addEventListener('visibilitychange', function () { if (!document.hidden) beat(); });
    addEventListener('pageshow', beat);
    addEventListener('pagehide', function () { try { navigator.sendBeacon('/goodbye'); } catch (e) {} });
  })();
</script>
{% endif %}
