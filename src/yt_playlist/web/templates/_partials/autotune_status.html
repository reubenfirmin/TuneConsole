{# Auto-tune control: while running, self-poll every 2s; when idle, show the button + last result. #}
<div id="autotune-status"{% if running %} hx-get="/taste/autotune-status" hx-trigger="load delay:2s" hx-swap="outerHTML"{% endif %}>
  {% if running %}
  <div class="autotune-ctl">
    <button disabled><span class="spinner"></span> Auto-tuning… (rebuilding several models)</button>
  </div>
  {% else %}
  <div class="autotune-ctl">
    <button hx-post="/taste/autotune" hx-target="#autotune-status" hx-swap="outerHTML"
            hx-confirm="Test several model sizes and keep the most accurate? This takes about 10 seconds.">Auto-tune model</button>
    <span class="autotune-note">The chosen model size stays in use for future rebuilds until you run Auto-tune again.</span>
  </div>
  {% include "_partials/autotune_result.html" %}
  {% endif %}
</div>
