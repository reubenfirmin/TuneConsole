{# Optional history import, offered after onboarding. #}
{% if show_takeout_nag %}
<section class="alerts" aria-label="Needs attention">
  <div class="alert-card card card--featured alert-nudge" id="takeout-nag">
    <button type="button" class="alert-x" aria-label="Dismiss" title="Dismiss"
            hx-post="/onboard/takeout/dismiss" hx-target="#takeout-nag" hx-swap="outerHTML swap:200ms">×</button>
    <span class="alert-cover"><img src="/static/nag/takeout.png" alt="" loading="lazy"
         onerror="this.closest('.alert-cover').classList.add('no-art'); this.remove()"></span>
    <div class="alert-body">
      <span class="alert-title">Want better recommendations? Add your past YouTube Music listening with a Google Takeout history import. Your history stays on this machine.</span>
      <div class="alert-foot"><a class="btn btn-sm alert-go" href="/setup?tab=import">Add listening history {{ arrow_icon('right') }}</a></div>
    </div>
  </div>
</section>
{% endif %}
