<div class="listening-edition" x-data='listeningEditorial({{ listening_edition|tojson }})' data-listening-edition>
  <div class="le-stories">
  {% for story in listening_edition.stories %}
    <article class="le-story {{ 'le-lead' if loop.first else 'le-support' }} le-{{ story.visual }}{% if story.backdrop %} le-art-{{ story.art_side }}{% endif %}"
             data-story-id="{{ story.id }}" aria-labelledby="le-title-{{ story.id }}">
      {% if story.backdrop %}
      <div class="le-backdrop" aria-hidden="true"><img src="{{ story.backdrop }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.remove()"></div>
      {% endif %}
      <div class="le-copy">
        <h2 id="le-title-{{ story.id }}"><a class="le-story-link" href="{{ story.url }}">{{ story.title }}</a></h2>
        <p class="le-evidence">{{ story.evidence }}</p>
      </div>
      <figure class="le-figure">
        <div class="le-composition" x-html="composition({{ loop.index0 }})"></div>
        {% if story.visual == 'rating_actions' and story.rating_tracks %}
        <div class="le-rating-songs">
          <p class="le-rating-caption">{% if story.rating_track_count > story.rating_tracks|length %}Latest {{ story.rating_tracks|length }} of {{ story.rating_track_count }} songs{% else %}{{ story.rating_track_count }} songs{% endif %}</p>
          <table aria-label="Songs with confirmed rating changes">
            <thead><tr><th scope="col">Song</th><th scope="col">Hearts</th><th scope="col">Skulls</th><th scope="col">Clears</th></tr></thead>
            <tbody>
            {% for song in story.rating_tracks %}
              <tr>
                <th scope="row">
                  {% if song.video_id %}<a href="https://music.youtube.com/watch?v={{ song.video_id|urlencode }}" target="_blank" rel="noopener">{{ song.name }}</a>{% else %}{{ song.name }}{% endif %}
                  <span class="le-rating-artist">{{ song.artist }}</span>
                  <time datetime="{{ song.last_day }}">{{ song.last_day }}</time>
                </th>
                <td>{{ song.hearts }}</td><td>{{ song.skulls }}</td><td>{{ song.clears }}</td>
              </tr>
            {% endfor %}
            {% if story.rating_track_count > story.rating_tracks|length %}
              <tr class="le-rating-other"><th scope="row">{{ story.rating_track_count - story.rating_tracks|length }} other songs</th><td>{{ story.rating_other_counts.hearts }}</td><td>{{ story.rating_other_counts.skulls }}</td><td>{{ story.rating_other_counts.clears }}</td></tr>
            {% endif %}
            </tbody>
          </table>
        </div>
        {% endif %}
      </figure>
    </article>
  {% endfor %}
  </div>
</div>
