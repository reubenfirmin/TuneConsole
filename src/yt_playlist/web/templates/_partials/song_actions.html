{# One menu and one action dialog per page, shared by every song launcher. #}
<div x-data="songActions()" @song-menu-open.window="show($event.detail)">
  <div id="song-action-menu" class="song-action-menu" x-ref="menu" popover="auto"
       role="menu" aria-label="Song actions" @toggle="menuToggled($event)"
       @keydown="menuKey($event)">
    <button type="button" role="menuitem" @click="play()">Play on YouTube Music</button>
    <button type="button" role="menuitem" @click="similar()">Songs like this</button>
    <button type="button" role="menuitem" @click="openDialog('create')">Create playlist from song</button>
    <button type="button" role="menuitem" @click="openDialog('add')">Add song to playlist</button>
    <button type="button" role="menuitem" @click="openDialog('metadata')">Edit Metadata</button>
    <a role="menuitem" :href="trackUrl(song)">Track details</a>
    <template x-if="context.playlist">
      <div role="group" aria-label="This playlist">
        <button type="button" role="menuitem" @click="localAction('findAlternates')">Find alternate versions</button>
        <button type="button" role="menuitem" class="danger" @click="localAction('removeTrack')">Remove from playlist</button>
      </div>
    </template>
    <template x-if="context.mood_key">
      <div role="group" aria-label="Tune your Home picks">
        <button type="button" role="menuitem" @click="mood(1)">🔥 More like this</button>
        <button type="button" role="menuitem" @click="mood(-1)">🙅 Less like this</button>
      </div>
    </template>
    <template x-if="context.suggestion">
      <div role="group" aria-label="Not for this playlist">
        <span class="song-menu-caption">Not for this playlist</span>
        <template x-for="reason in reasons" :key="reason[0]">
          <button type="button" role="menuitem" @click="dismiss(reason[0])" x-text="reason[1]"></button>
        </template>
      </div>
    </template>
  </div>
  <dialog class="song-playlist-dialog" x-ref="dialog"
          aria-labelledby="song-playlist-title"
          :class="{ 'has-result': result }"
          @cancel.prevent="closeDialog()" @keydown.tab="trapFocus($event)"
          @click="backdropClick($event)">
    <form @submit.prevent="submit()" :aria-busy="busy">
      <header class="song-dialog-head">
        <h2 id="song-playlist-title" x-show="!result" x-text="mode === 'metadata' ? 'Edit Metadata' : mode === 'create' ? 'Create playlist' : 'Add to playlist'"></h2>
        <p class="song-dialog-status" role="status" x-show="result" :class="{ 'is-incomplete': result?.status === 'partial' || result?.added === false }">
          <svg x-show="result?.status !== 'partial' && result?.added !== false" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>
          <svg x-show="result?.status === 'partial' || result?.added === false" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3v1"/></svg>
          <span x-text="result?.message"></span>
        </p>
        <button type="button" class="song-dialog-close" :aria-label="mode === 'metadata' ? 'Close metadata dialog' : 'Close playlist dialog'" @click="closeDialog()" :disabled="busy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
        </button>
      </header>
      <div class="song-dialog-track">
        <div class="song-dialog-art" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><circle cx="32" cy="32" r="18"/><circle cx="32" cy="32" r="8"/><circle cx="32" cy="32" r="2"/></svg>
          <template x-if="song.thumbnail && !artworkFailed">
            <img :src="song.thumbnail" alt="" referrerpolicy="no-referrer" @error="artworkFailed = true">
          </template>
        </div>
        <div class="song-dialog-track-copy">
          <strong x-show="!result" x-text="song.title"></strong>
          <h2 id="song-playlist-result-title" x-show="result" x-text="result?.title"></h2>
          <p x-show="result?.added !== false"
             x-text="result && mode === 'add' ? [song.title, song.artist].filter(Boolean).join(' · ') : song.artist"></p>
        </div>
      </div>
      <div class="song-dialog-fields" x-show="!result">
        <fieldset class="song-metadata-fields" x-show="mode === 'metadata'" :disabled="busy || loading || !metadataLoaded">
          <label class="song-dialog-label">Title
            <input type="text" x-ref="metadataTitle" x-model="metadata.title" maxlength="1000"
                   :required="mode === 'metadata'" autocomplete="off">
          </label>
          <button type="button" class="song-metadata-restore"
                  x-show="originals.title != null && metadata.title !== originals.title"
                  @click="metadata.title = originals.title">Restore original title</button>
          <label class="song-dialog-label">Artist
            <input type="text" x-model="metadata.artist" maxlength="1000" autocomplete="off">
          </label>
          <button type="button" class="song-metadata-restore"
                  x-show="originals.artist != null && metadata.artist !== originals.artist"
                  @click="metadata.artist = originals.artist">Restore original artist</button>
          <div class="song-metadata-pair">
            <label class="song-dialog-label">Genre
              <input type="text" x-model="metadata.genre" maxlength="80" list="song-metadata-genres" autocomplete="off">
            </label>
            <label class="song-dialog-label">Year
              <input type="text" x-model="metadata.year" inputmode="numeric" pattern="[0-9]{4}"
                     maxlength="4" placeholder="YYYY" autocomplete="off">
            </label>
          </div>
          <datalist id="song-metadata-genres">
            <template x-for="genre in genres" :key="genre"><option :value="genre"></option></template>
          </datalist>
          <div class="song-metadata-suggestions" x-show="genreOptions.length" role="group" aria-label="Genre suggestions">
            <template x-for="option in genreOptions" :key="option.value">
              <button type="button" :class="{ 'is-selected': metadata.genre === option.value }"
                      :aria-pressed="metadata.genre === option.value" @click="metadata.genre = option.value">
                <span x-text="option.value"></span><small x-text="option.providers.join(', ')"></small>
              </button>
            </template>
          </div>
          <button type="button" class="song-metadata-restore" x-show="trackId"
                  :disabled="lookupRunning" @click="lookupGenres()">Look up genres</button>
          <p class="song-dialog-note" x-show="lookupStatus" role="status" x-text="lookupStatus"></p>
        </fieldset>
        <p class="song-dialog-note" x-show="mode === 'metadata' && loading" role="status">Loading metadata…</p>
        <label class="song-dialog-label" x-show="mode === 'create'">Playlist name
          <input type="text" x-ref="name" x-model="name" maxlength="200" :required="mode === 'create'" :disabled="busy" autocomplete="off">
        </label>
        <div x-show="mode === 'add'">
          <div class="song-dialog-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input type="search" x-ref="search" x-model="query" placeholder="Find a playlist…"
                   aria-label="Find a playlist" :disabled="busy || loading" autocomplete="off">
          </div>
          <p class="song-dialog-note" x-show="loading" role="status">Loading playlists…</p>
          <div class="song-playlist-options" role="group" aria-label="Choose a playlist">
            <template x-for="playlist in matches()" :key="playlist.id">
              <label class="song-playlist-option" :class="{ 'is-selected': String(playlist.id) === selected }">
                <input type="radio" name="song-destination" :value="String(playlist.id)" x-model="selected"
                       :disabled="busy || playlist.already_present">
                <span><strong x-text="playlist.title"></strong>
                  <small x-show="multipleIdentities" x-text="playlist.identity"></small></span>
                <small x-show="playlist.already_present">Already added</small>
              </label>
            </template>
          </div>
          <p x-show="!loading && !error && !matches().length" class="song-dialog-note"
             x-text="query ? 'No matching playlists.' : 'No playlists available. Create one from the song menu.'"></p>
        </div>
      </div>
      <p class="song-action-error" role="alert" x-show="error" x-text="error"></p>
      <p class="song-dialog-note" x-show="result?.guidance" x-text="result?.guidance"></p>
      <footer class="song-dialog-actions">
        <button type="button" class="btn-ghost" @click="closeDialog()" :disabled="busy" x-text="result ? 'Done' : 'Cancel'"></button>
        <button type="submit" class="btn-primary" x-show="!result"
                :disabled="busy || loading || (mode === 'metadata' ? !metadataLoaded || !metadata.title.trim() : mode === 'create' ? !name.trim() : !selected)"
                x-text="busy ? 'Saving…' : mode === 'metadata' ? 'Save changes' : mode === 'create' ? 'Create playlist' : 'Add song'"></button>
        <a class="btn-ghost" x-show="result?.recovery_url" :href="result?.recovery_url">Action Log and recovery</a>
        <a class="btn btn-primary" x-show="result" x-ref="resultLink" :href="result?.url">
          <span x-text="result?.status === 'partial' ? 'Review playlist' : 'Open playlist'"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
        </a>
      </footer>
    </form>
  </dialog>
</div>
