<template x-teleport="body">
<dialog class="album-listening" x-data="albumListening()" x-init="mount($el)"
        aria-labelledby="album-listening-title"
        @album-listening-requested.window="request($event.detail)"
        @playback-requested.window="pending = candidate = null"
        @album-play-started.window="accept($event.detail)"
        @album-artwork-open.window="show()"
        @bridge-status.window="update($event.detail)"
        @tv-playback-state.window="if (window.tvPlaybackControls?.active()) clear()"
        @close="closed()">
  <template x-if="album">
    <div class="album-listening-room">
      <img class="album-listening-ambient" x-show="artwork()" :src="artwork()" alt="" aria-hidden="true" referrerpolicy="no-referrer">
      <header class="album-listening-header">
        <div class="album-listening-identity">
          <h2 id="album-listening-title" x-text="album.title"></h2>
          <p x-text="album.artist"></p>
        </div>
        <a class="album-listening-back" :href="tracksUrl()" @click="dismiss()" title="Back to tracks (Escape closes artwork)">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M11 3 2 12l9 9 3-3-4-4h12v-4H10l4-4z"/></svg>
          <span>Back to tracks</span>
        </a>
      </header>
      <div class="album-listening-stage">
        <img class="album-listening-cover" x-show="artwork()" :src="artwork()" :alt="album.title + ' album cover'"
             @error="artworkFailed = album.thumbnail" referrerpolicy="no-referrer">
        <svg class="album-listening-placeholder" x-show="!artwork()" viewBox="0 0 100 100" aria-label="Album artwork unavailable" role="img">
          <circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="28"/><circle cx="50" cy="50" r="5"/>
        </svg>
      </div>
      <footer class="album-listening-footer">
        <div class="album-listening-track">
          <a :href="trackUrl(nowPlaying || {})" @click="dismiss()" x-text="nowPlaying?.title || ''"></a>
          <span x-text="nowPlaying?.artist || ''"></span>
        </div>
        <div class="album-listening-controls">{% include '_partials/playback_controls.html' %}</div>
        <span class="album-listening-time" x-text="timeLabel(timing.position) + ' / ' + timeLabel(timing.duration)"></span>
      </footer>
    </div>
  </template>
</dialog>
</template>
